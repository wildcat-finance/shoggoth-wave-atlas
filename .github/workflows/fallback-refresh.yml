name: Fallback snapshot refresh

# The Atlas reads GitHub at request time and caches for ten minutes. The
# checked-in snapshot in app/waves-data.json and app/waves-meta.json is the
# floor under that read, not the source. A floor ages on its own, so this keeps
# it current without anyone having to remember to.
#
# Nothing here publishes generated data to main. A change becomes one pull
# request on one branch; a person merges it.

on:
  schedule:
    # Every six hours, off the hour so it does not queue behind the crowd that
    # schedules itself at :00.
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions: {}

# One refresh at a time. Two overlapping runs would race the same branch and
# could open a second pull request for the same job.
concurrency:
  group: fallback-snapshot-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      # Enough to update the refresh branch and its pull request. Nothing else.
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The refresh commit is made through the GitHub API, not `git push`,
          # so no credential is stored in .git/config or in a remote URL.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - name: Keep the snapshot this run would replace
        # Read from git rather than the worktree, so it survives the sync
        # overwriting the file in the next step.
        run: git show HEAD:app/waves-data.json > "$RUNNER_TEMP/baseline-waves.json"

      - name: Read Skills and regenerate the fallback
        # No credential is passed. Skills is public, and this workflow's own
        # GITHUB_TOKEN is scoped to this repository: handing it to the read
        # returned fourteen milestones and zero issues, where an
        # unauthenticated read of the same endpoints returned the whole
        # backlog. sync-waves.mjs throws on a failed page, an unparseable body,
        # a missing source revision, an empty result, or a transform failure,
        # and writes nothing before every read has succeeded.
        run: node scripts/sync-waves.mjs

      - name: Validate the generated snapshot
        run: node scripts/validate-waves-snapshot.mjs --baseline "$RUNNER_TEMP/baseline-waves.json"

      - name: Detect whether the generated bytes changed
        id: detect
        run: |
          unexpected="$(git status --porcelain -- . ':!app/waves-data.json' ':!app/waves-meta.json')"
          if [ -n "$unexpected" ]; then
            echo "The refresh touched files it does not own:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          if git diff --quiet -- app/waves-data.json app/waves-meta.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The fallback already matches Skills. Nothing to publish."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.detect.outputs.changed == 'true'
        run: npm test

      - name: Lint
        if: steps.detect.outputs.changed == 'true'
        run: npm run lint

      - name: Check the diff for whitespace damage
        if: steps.detect.outputs.changed == 'true'
        run: git diff --check

      - name: Update the refresh branch and its pull request
        if: steps.detect.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Optional. Opening a pull request from Actions is gated by a setting
          # pinned above this organisation, so github.token is refused however
          # the permissions block is written. A fine-grained token with
          # `pull-requests: write` on this repository is not subject to that
          # gate. Without it the refresh still commits to the branch and warns
          # that the pull request needs opening by hand.
          PR_TOKEN: ${{ secrets.PR_TOKEN }}
        run: node scripts/publish-fallback-refresh.mjs
